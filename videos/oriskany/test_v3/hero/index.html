<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>Oriskany hero: scale + stern-first descent</title>
<!-- Narration 15.30 s -> 20.50 s. "About nine hundred feet of warship, now sitting two hundred and twelve feet down."
     Kit ShipSink (kit/ship/sinking) + a timed length ruler. Gauge lands on "feet" (narration 19.31 = scene 4.01). -->
<script src="vendor/gsap.min.js"></script>
<script src="ships.js"></script>
<script src="sinking.js"></script>
<style>
@font-face { font-family: "Oswald"; font-weight: 500; src: url("fonts/oswald-latin-500-normal.woff2") format("woff2"); }
@font-face { font-family: "Oswald"; font-weight: 700; src: url("fonts/oswald-latin-700-normal.woff2") format("woff2"); }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0b141c; font-family: Oswald, sans-serif; }
#ruler { position:absolute; left:0; top:0; width:1920px; height:1080px; pointer-events:none; }
.rl-t { position:absolute; color:#f7f3ea; font-weight:700; letter-spacing:.08em; text-shadow:0 3px 12px rgba(0,0,0,.8); white-space:nowrap; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080">
  <div id="stage"></div>
  <div id="ruler"></div>
</div>
<script>
  // v3: narration 17.50 -> 20.55 ("now sitting two hundred and twelve feet down"). The 900 FT card is on the film shot before.
  const T0 = 17.50, DUR = 3.05, T_NOW = 17.59 - T0, T_FEET = 19.31 - T0;
  const S = ShipSink(document.getElementById("stage"), { ship: "carrier", depthFt: 212, duration: DUR, mode: "stern", pitch: 9,
    charges: false, sinkStart: 0.04, landAt: (T_FEET - 0.05) / DUR, sonar: true, gaugeWorld: true, gaugeMax: 240 });
  document.getElementById("root").dataset.duration = DUR;
  const tl = S.tl;
  window.__timelines = window.__timelines || {}; window.__timelines["main"] = tl;
  window.__sink = { duration: DUR, landT: S.landT, cues: S.cues };
  tl.seek(0);
</script>
</body>
</html>
