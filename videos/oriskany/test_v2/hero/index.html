<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>Oriskany hero: scale + stern-first descent</title>
<!-- Narration 15.30 s -> 20.50 s. "About nine hundred feet of warship, now sitting two hundred and twelve feet down."
     Kit ShipSink (kit/ship/sinking) + a timed length ruler. Gauge lands on "feet" (narration 19.31 = scene 4.01). -->
<script src="vendor/gsap.min.js"></script>
<script src="ships.js"></script>
<script src="sinking.js"></script>
<style>
@font-face { font-family: "Oswald"; font-weight: 500; src: url("fonts/oswald-latin-500-normal.woff2") format("woff2"); }
@font-face { font-family: "Oswald"; font-weight: 700; src: url("fonts/oswald-latin-700-normal.woff2") format("woff2"); }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0b141c; font-family: Oswald, sans-serif; }
#ruler { position:absolute; left:0; top:0; width:1920px; height:1080px; pointer-events:none; }
.rl-t { position:absolute; color:#f7f3ea; font-weight:700; letter-spacing:.08em; text-shadow:0 3px 12px rgba(0,0,0,.8); white-space:nowrap; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080">
  <div id="stage"></div>
  <div id="ruler"></div>
</div>
<script>
  const DUR = 5.2, T_NINE = 15.66 - 15.30, T_NOW = 17.59 - 15.30, T_FEET = 19.31 - 15.30;
  const S = ShipSink(document.getElementById("stage"), { ship: "carrier", depthFt: 212, duration: DUR, mode: "stern", pitch: 9,
    charges: false, sinkStart: T_NOW / DUR, landAt: (T_FEET - 0.05) / DUR, sonar: true });
  document.getElementById("root").dataset.duration = DUR;
  // length ruler under the hull while she is still afloat (screen px: ship spans ~72 % of 1920, centred at 58 %)
  const R = document.getElementById("ruler"), L = 1920 * 0.72, x0 = 1920 * 0.58 - L / 2, y = 640;
  R.innerHTML = `<svg width="1920" height="1080" style="position:absolute;left:0;top:0">
      <g id="rl" opacity="0" stroke="#e3c27a" stroke-width="5" fill="none">
        <line id="rl-l" x1="${x0}" y1="${y}" x2="${x0 + L}" y2="${y}"/>
        <line x1="${x0}" y1="${y - 22}" x2="${x0}" y2="${y + 22}"/><line x1="${x0 + L}" y1="${y - 22}" x2="${x0 + L}" y2="${y + 22}"/></g></svg>
    <div id="rl-n" class="rl-t" style="left:${x0 + L / 2}px;top:${y + 26}px;font-size:84px;transform:translateX(-50%);opacity:0">ABOUT 900 FT</div>
    <div id="rl-s" class="rl-t" style="left:${x0 + L / 2}px;top:${y + 132}px;font-size:28px;color:#e3c27a;letter-spacing:.3em;transform:translateX(-50%);opacity:0">USS ORISKANY · CV-34</div>`;
  const tl = S.tl;
  tl.fromTo("#rl", { opacity: 0 }, { opacity: 1, duration: 0.25, immediateRender: false }, T_NINE - 0.05);
  tl.fromTo("#rl-l", { attr: { x2: x0 } }, { attr: { x2: x0 + L }, duration: 0.6, ease: "power3.out", immediateRender: false }, T_NINE - 0.05);
  tl.fromTo("#rl-n", { opacity: 0, y: 20, scale: 1.25 }, { opacity: 1, y: 0, scale: 1, duration: 0.3, ease: "back.out(2)", immediateRender: false }, T_NINE + 0.05);
  tl.fromTo("#rl-s", { opacity: 0 }, { opacity: 1, duration: 0.4, immediateRender: false }, T_NINE + 0.4);
  gsap.set(".sink-gauge", { opacity: 0 });
  tl.fromTo(".sink-gauge", { opacity: 0 }, { opacity: 1, duration: 0.35, immediateRender: false }, T_NOW - 0.2);
  tl.to(["#rl", "#rl-n", "#rl-s"], { opacity: 0, duration: 0.35 }, T_NOW - 0.1);
  window.__timelines = window.__timelines || {}; window.__timelines["main"] = tl;
  window.__sink = { duration: DUR, landT: S.landT, cues: S.cues };
  tl.seek(0);
</script>
</body>
</html>
