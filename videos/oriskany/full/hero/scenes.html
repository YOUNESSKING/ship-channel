<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>Oriskany full: animation scenes</title>
<!-- One page, every kit / hero animation scene of the full video: scenes.html?scene=c06_lines_b (list: scenes_cfg.js).
     Rendered by render_anim.js through build/make_anims.py. Look = test v4 hero (ShipSink, CarrierHero, Oswald, cream + gold). -->
<script src="vendor/gsap.min.js"></script>
<script src="ships.js"></script>
<script src="carrier_hero.js"></script>
<script src="sinking.js"></script>
<script src="scenes_cfg.js"></script>
<script src="scenes.js"></script>
<style>
@font-face { font-family: "Oswald"; font-weight: 500; src: url("fonts/oswald-latin-500-normal.woff2") format("woff2"); }
@font-face { font-family: "Oswald"; font-weight: 700; src: url("fonts/oswald-latin-700-normal.woff2") format("woff2"); }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0b141c; font-family: Oswald, sans-serif; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080">
  <div id="stage"></div>
</div>
<script>
  (function () {
    const q = new URLSearchParams(location.search), name = q.get("scene") || window.SCENE;
    try {
      const A = AnimScenes.build(document.getElementById("stage"), name, window.SCENES[name]);
      document.getElementById("root").dataset.duration = A.duration;
      window.__timelines = window.__timelines || {}; window.__timelines["main"] = A.tl;
      window.__anim = { scene: name, beats: A.beats, cues: A.cues || [], missing: A.missing };
      A.tl.seek(0);
    } catch (e) { window.__animError = String(e && e.stack || e); console.error(e); }
  })();
</script>
</body>
</html>
